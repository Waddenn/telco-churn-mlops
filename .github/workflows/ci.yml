name: CI

on:
  push:
  pull_request:

jobs:
  quality:
    name: Lint and tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install -r requirements.txt
      - run: ruff check src tests
      - run: ruff format --check src tests
      - run: python -m pytest -q

  pipeline:
    name: End-to-end training and evaluation
    runs-on: ubuntu-latest
    needs: quality
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install -r requirements.txt
      - run: make data PYTHON=python
      - run: make analyze PYTHON=python
      - run: make train PYTHON=python
      - run: make evaluate PYTHON=python
      - run: cat artifacts/metrics.json
      - uses: actions/upload-artifact@v7
        with:
          name: mlops-evaluation
          path: |
            artifacts/*.json
            artifacts/*.png
            artifacts/predictions.csv
            reports/*.md
            reports/figures/*.png
